# Local development stack: Laravel + Nuxt + MySQL.
# Docker Compose covers development only (see docs/architecture.md).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: racha
      MYSQL_USER: racha
      MYSQL_PASSWORD: racha
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      default:
        # Backend connects with DB_HOST=mysql; expose that hostname here.
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: racha
      DB_USERNAME: racha
      DB_PASSWORD: racha
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      # Container-managed volume keeps the image's vendor/ from being masked
      # by the bind mount above.
      - backend-vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      NUXT_API_BASE_INTERNAL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Container-managed volume keeps the image's node_modules/ from being
      # masked by the bind mount above.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  # End-to-end tests (B-06). The frontend image is alpine/musl, where Playwright
  # browsers do not run, so E2E uses the official Playwright image (browsers
  # preinstalled) and hits the frontend over the Compose network.
  # Behind the `e2e` profile so it never starts with a plain `docker compose up`.
  # Run with: docker compose run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      CI: "true"
    volumes:
      - ./frontend:/app
      # Dedicated volume keeps these glibc-built deps separate from the
      # frontend's alpine/musl node_modules.
      - e2e-node-modules:/app/node_modules
    command: sh -c "npm install && npx playwright test"
    depends_on:
      - frontend
    profiles:
      - e2e

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:
  e2e-node-modules:

networks:
  default:
