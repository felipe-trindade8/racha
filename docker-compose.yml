# Local development stack: Laravel + Nuxt + MySQL.
# Docker Compose covers development only (see docs/architecture.md).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: racha
      MYSQL_USER: racha
      MYSQL_PASSWORD: racha
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      default:
        # Backend connects with DB_HOST=mysql; expose that hostname here.
        aliases:
          - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: racha
      DB_USERNAME: racha
      DB_PASSWORD: racha
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      # Container-managed volume keeps the image's vendor/ from being masked
      # by the bind mount above.
      - backend-vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      NUXT_API_BASE_INTERNAL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Container-managed volume keeps the image's node_modules/ from being
      # masked by the bind mount above.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:

networks:
  default:
